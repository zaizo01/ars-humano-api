services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: health_authorizations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_authorizations"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=db;Port=5432;Database=health_authorizations;Username=postgres;Password=postgres"
      Database__ApplyMigrationsOnStartup: "true"
    restart: unless-stopped

volumes:
  pgdata:
