version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      microsoft:
        patterns: ["Microsoft.*", "Npgsql.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
