name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud usa el historial para detectar código nuevo

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      # SonarCloud envuelve build + pruebas (begin/end). Sin el secret SONAR_TOKEN se omite.
      # Única excepción (S2068, credenciales en código): docker-compose.yml y appsettings.Development.json,
      # que contienen a propósito credenciales de contenedores locales. Producción no tiene ninguna.
      - name: SonarCloud - inicio
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool install -g dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY || 'zaizo01_ars-humano-api' }}" \
            /o:"${{ vars.SONAR_ORGANIZATION || 'zaizo01' }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/Program.cs,tests/**" \
            /d:sonar.issue.ignore.multicriteria="devcompose,devjson,devcs" \
            /d:sonar.issue.ignore.multicriteria.devcompose.ruleKey="yaml:S2068" \
            /d:sonar.issue.ignore.multicriteria.devcompose.resourceKey="docker-compose.yml" \
            /d:sonar.issue.ignore.multicriteria.devjson.ruleKey="json:S2068" \
            /d:sonar.issue.ignore.multicriteria.devjson.resourceKey="**/appsettings.Development.json" \
            /d:sonar.issue.ignore.multicriteria.devcs.ruleKey="csharpsquid:S2068" \
            /d:sonar.issue.ignore.multicriteria.devcs.resourceKey="**/appsettings.Development.json" \
            /d:sonar.qualitygate.wait=true

      - name: Sin SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secret SONAR_TOKEN; se omite el análisis de SonarCloud"

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Paquetes con vulnerabilidades conocidas
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q -E "Critical|High" vulnerable.txt; then
            echo "::error::Hay paquetes con vulnerabilidades altas o críticas"
            exit 1
          fi

      # Las pruebas de integración usan Testcontainers (Docker ya está disponible en ubuntu-latest).
      - name: Pruebas
        run: >
          dotnet test -c Release --no-build
          --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger trx

      - name: SonarCloud - fin y quality gate
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Reporte de cobertura
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"HtmlInline;MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage/

  docker:
    name: Imagen Docker
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)

      # Solo se publica desde ramas de integración y tags; las features solo validan.
      - name: Login a GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # GitOps: el pipeline no despliega en el clúster; solo cambia la versión declarada en el repo GitOps
  # y Argo CD sincroniza. develop → dev (commit directo); tag v* → prod (pull request para aprobar).
  update-gitops:
    name: Actualizar repo GitOps
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      GITOPS_REPO: ${{ vars.GITOPS_REPO || 'zaizo01/ars-humano-gitops' }}
      APP_PATH: apps/health-authorizations-api/overlays
    steps:
      - name: Verificar token
        id: check
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::warning::Falta el secret GITOPS_TOKEN: se omite la actualización del repo GitOps"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: gitops

      # Solo se reemplaza la línea newTag (kustomize edit reescribe todo el archivo y ensucia el diff,
      # que en GitOps es la auditoría del despliegue).
      - name: Configurar autor
        if: steps.check.outputs.skip != 'true'
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dev - actualizar imagen
        if: steps.check.outputs.skip != 'true' && github.ref == 'refs/heads/develop'
        working-directory: gitops
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          FILE="$APP_PATH/dev/kustomization.yaml"
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 $TAG|" "$FILE"
          grep -q "newTag: $TAG" "$FILE" || { echo "::error::No se pudo actualizar newTag"; exit 1; }
          git add -A
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "chore(dev): deploy api $TAG"
          git push

      - name: Prod - abrir pull request
        if: steps.check.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="release/api-$VERSION"
          git switch -c "$BRANCH"
          FILE="$APP_PATH/prod/kustomization.yaml"
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 $VERSION|" "$FILE"
          grep -q "newTag: $VERSION" "$FILE" || { echo "::error::No se pudo actualizar newTag"; exit 1; }
          git commit -am "chore(prod): deploy api $VERSION"
          git push -u origin "$BRANCH"
          gh pr create --repo "$GITOPS_REPO" --base main --head "$BRANCH" \
            --title "chore(prod): deploy api $VERSION" \
            --body "Despliegue a producción de la versión $VERSION de la API (generado por el pipeline)."
